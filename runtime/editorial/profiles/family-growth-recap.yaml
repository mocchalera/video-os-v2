id: family-growth-recap
default_policy: chronological-recap
capabilities:
  visual_model:
    requirement: optional
defaults:
  target_duration_sec: 90
  opening_cadence: "gentle"
  middle_cadence: "chronological"
  ending_cadence: "warm"
  max_shot_length_frames: 144
  default_transition: "crossfade"
  crossfade_frames: 8
  audio_policy: ducking
  a1_loudnorm: true
  caption_policy: auto
  active_editing_skills:
    - build_to_peak
    - cooldown_resolve
    - b_roll_bridge
  quality_target_overrides:
    hook_density_min: 0.45
    novelty_rate_min: 0.65
  trim_policy_overrides:
    mode: adaptive
    default_preferred_duration_frames: 96
    default_min_duration_frames: 36
    default_max_duration_frames: 180
