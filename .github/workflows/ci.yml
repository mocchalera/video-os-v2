name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - Dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schemas
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run build
