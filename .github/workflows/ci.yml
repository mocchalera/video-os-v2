name: PR fast CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Required-check candidate for pull requests. Keep this to one Ubuntu runner
# and one root npm install; the full Node suite and real render run only in
# full-integration.yml on protected integration pushes or manual dispatch.
jobs:
  product-gate:
    name: PR fast product gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Assert Node and npm versions
        run: |
          test "$(node -v)" = "v22.23.1"
          test "$(npm -v)" = "10.9.8"

      - name: Install dependencies
        run: npm ci

      - name: Validate schemas
        run: npm run validate

      - name: Verify Agent Skill contracts
        run: npm run verify:skill-contracts

      - name: Run schema contract tests
        run: npm run test:schema-contract

      - name: Run speech-led artifact contract gate
        run: npm run test:speech-led-contract

      - name: Run event-recap shared-pipeline contract gate
        run: npm run test:event-recap-contract

      - name: Run Agentic Video connector contract tests
        run: npm run test:agentic-video

      - name: Verify Studio contracts
        run: npm run verify:studio-contracts

      - name: Check repository hygiene
        run: npm run verify:repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent generator dependencies
        run: python -m pip install pyyaml

      - name: Check generated agent definitions
        run: npm run verify:agents

      - name: Typecheck
        run: npm run build