name: Full integration CI

on:
  push:
    branches:
      - main
      - Dev
      - public-candidate/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Protected integration pushes pay for the complete product boundary. The
# manual mode also runs the Studio job below; the path-filtered Studio
# workflow covers only Studio-relevant PRs and protected pushes.
jobs:
  full-integration:
    name: Full Node, editor, and render integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json

      - name: Assert Node and npm versions
        run: |
          test "$(node -v)" = "v22.23.1"
          test "$(npm -v)" = "10.9.8"

      # One root install feeds the Node, editor, and render checks in this
      # job. The editor has a separate lockfile and is installed only below.
      - name: Install dependencies
        run: npm ci

      - name: Resolve pinned media toolchain
        run: bash scripts/ci-resolve-media-toolchain.sh

      - name: Log runner and media provenance
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          uname -srm
          uname -m
          node --version
          npm --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

      - name: Backport Vitest worker RPC fix
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const vitestPackage = JSON.parse(
            readFileSync("node_modules/vitest/package.json", "utf8"),
          );
          if (vitestPackage.version !== "3.2.4") {
            throw new Error(`Unexpected Vitest version: ${vitestPackage.version}`);
          }

          const chunksDirectory = "node_modules/vitest/dist/chunks";
          const rpcFiles = readdirSync(chunksDirectory).filter((name) =>
            /^rpc\..+\.js$/.test(name),
          );
          if (rpcFiles.length !== 1) {
            throw new Error(`Expected exactly one Vitest RPC chunk, found ${rpcFiles.length}`);
          }

          const rpcPath = join(chunksDirectory, rpcFiles[0]);
          const source = readFileSync(rpcPath, "utf8");
          const sourceSha256 = createHash("sha256").update(source).digest("hex");
          if (sourceSha256 !== "de377d3f6766cc38394adf8886e92fa2d3aabf442f1313ed612f308c625ba8b4") {
            throw new Error(`Unexpected Vitest RPC source SHA-256: ${sourceSha256}`);
          }

          const legacyTimeoutBlock = `\t\tonTimeoutError(functionName, args) {
          \t\t\tlet message = \`[vitest-worker]: Timeout calling "\${functionName}"\`;
          \t\t\tif (functionName === "fetch" || functionName === "transform" || functionName === "resolveId") message += \` with "\${JSON.stringify(args)}"\`;
          \t\t\t// JSON.stringify cannot serialize Error instances
          \t\t\tif (functionName === "onUnhandledError") message += \` with "\${args[0]?.message || args[0]}"\`;
          \t\t\tthrow new Error(message);
          \t\t},`;
          if (source.split(legacyTimeoutBlock).length !== 2) {
            throw new Error("Vitest worker RPC timeout block did not match exactly once");
          }

          const patched = source.replace(legacyTimeoutBlock, "\t\ttimeout: -1,");
          const patchedSha256 = createHash("sha256").update(patched).digest("hex");
          if (patchedSha256 !== "9a3679f30dc623ddebdd2d2effb5bb537f849358b42d4009466f38a718bb6af0") {
            throw new Error(`Unexpected patched Vitest RPC SHA-256: ${patchedSha256}`);
          }
          writeFileSync(rpcPath, patched);
          console.log(`Patched Vitest worker RPC timeout: ${rpcFiles[0]} ${patchedSha256}`);
          NODE

      - name: Validate schemas
        run: npm run validate

      - name: Verify Agent Skill contracts
        run: npm run verify:skill-contracts

      - name: Typecheck
        run: npm run build

      - name: Run full Node test suite
        run: |
          npm test -- \
            --exclude=tests/review-rounds-metric.test.ts \
            --exclude=tests/premiere-roundtrip-base-conflict.test.ts \
            --exclude tests/editor-server-hook-lock.test.ts \
            --exclude tests/editor-server-project-health-redaction.test.ts \
            --exclude tests/editor-server-source-map-route-redaction.test.ts \
            --silent=passed-only \
            --testTimeout=30000 \
            --shard=1/2
          npm test -- \
            --exclude=tests/review-rounds-metric.test.ts \
            --exclude=tests/premiere-roundtrip-base-conflict.test.ts \
            --exclude tests/editor-server-hook-lock.test.ts \
            --exclude tests/editor-server-project-health-redaction.test.ts \
            --exclude tests/editor-server-source-map-route-redaction.test.ts \
            --silent=passed-only \
            --testTimeout=30000 \
            --shard=2/2

      # These two contention-sensitive files retain all cases, including the
      # internal 16-way retry check, but run outside the 4-worker shards.
      - name: Run contention-sensitive Node tests serially
        run: |
          ./node_modules/.bin/vitest run \
            tests/review-rounds-metric.test.ts \
            tests/premiere-roundtrip-base-conflict.test.ts \
            --silent=passed-only \
            --maxWorkers=1 \
            --testTimeout=180000

      - name: Install editor dependencies
        run: npm --prefix editor ci

      # editor/client is retired; editor/tsconfig.json intentionally owns
      # only the supported preview server and shared render/parity contracts.
      - name: Typecheck supported preview server and shared contracts
        run: npm --prefix editor run typecheck

      - name: Run editor-server integration tests
        run: npm run test:editor-server-integration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent generator dependencies
        run: python -m pip install pyyaml

      - name: Check generated agent definitions
        run: npm run verify:agents

      - name: Verify Studio contracts
        run: npm run verify:studio-contracts

      - name: Check repository hygiene
        run: npm run verify:repo

      - name: Log render runtime provenance
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          uname -srm
          uname -m
          node --version
          npm --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          google-chrome --version
          node -p '"remotion=" + require("./node_modules/remotion/package.json").version'
          node -p '"@remotion/renderer=" + require("./node_modules/@remotion/renderer/package.json").version'
          node -p '"hyperframes=" + require("./node_modules/hyperframes/package.json").version'

      - name: Run real render integration test
        run: npm run test:render-integration

  macos-studio:
    name: macOS Studio (manual full integration)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert Xcode and Swift versions
        run: |
          test -d "${DEVELOPER_DIR}"
          test "$(xcodebuild -version)" = "$(printf 'Xcode 15.4\nBuild version 15F31d')"
          xcrun swift --version | sed -n '1p' | grep -E '^Apple Swift version 5\.10 '

      - name: Build Studio target
        run: swift build --target VideoOSStudio

      - name: Run SwiftPM tests
        run: swift test

      - name: Run Studio CLI smoke
        run: swift run videoos-studio-cli doctor

  full-product-gate:
    name: Full integration product gate
    if: ${{ always() }}
    needs:
      - full-integration
      - macos-studio
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require full integration boundaries
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_INTEGRATION_RESULT: ${{ needs.full-integration.result }}
          MACOS_STUDIO_RESULT: ${{ needs.macos-studio.result }}
        run: |
          if [ "$FULL_INTEGRATION_RESULT" != "success" ]; then
            echo "Full integration product gate blocked: Node/editor/render boundary was not successful."
            exit 1
          fi

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$MACOS_STUDIO_RESULT" != "success" ]; then
                echo "Full integration product gate blocked: manual dispatch requires macOS Studio success."
                exit 1
              fi
              ;;
            push)
              if [ "$MACOS_STUDIO_RESULT" != "skipped" ]; then
                echo "Full integration product gate blocked: macOS Studio must be skipped on push; path-filtered Studio runs are separate."
                exit 1
              fi
              ;;
            *)
              echo "Full integration product gate blocked: unsupported event '$EVENT_NAME'."
              exit 1
              ;;
          esac

          echo "Full integration product gate passed: Node/editor/render boundary is green and Studio mode is satisfied."
