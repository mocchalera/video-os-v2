version: "1"
project_id: ax1-participant-voices-20260401
created_at: "2026-04-01T08:45:00Z"

project:
  id: ax1-participant-voices-20260401
  title: AX-1 参加者の声 集客インタビュー
  strategy: message-first
  client: AX-1
  format: testimonial-promo
  runtime_target_sec: 60
  duration_mode: guide

message:
  primary: AX-1は経営者がAI活用の解像度を一気に上げ、次の行動に踏み出したくなる実践的な場である。
  secondary:
    - 参加者本人の言葉で信頼感をつくる
    - 学びだけでなく変化と熱量が伝わる構成にする
    - 説明会参加の後押しになる期待感を残す

audience:
  primary: AX-1の今後の説明会参加を検討している経営者層
  secondary:
    - AI活用の必要性を感じているが、何から始めるべきか迷っている経営者
    - 実際の参加者の変化や納得感を確認したい見込み顧客
  excluded:
    - テクニカルな機能説明や詳細カリキュラムだけを求める視聴者

emotion_curve:
  - credibility
  - curiosity
  - momentum
  - conviction
  - action

must_have:
  - 参加価値が一言で伝わる強い testimonial line
  - 受講前後の認識変化や実践イメージに触れる発言
  - 複数人の声がある素材では diversity を感じる抜粋
  - テロップで要点が追える構成
  - 30秒から90秒の範囲に収まること

must_avoid:
  - interviewer の問いを長く残して間延びさせること
  - 説明調に寄りすぎて広告コピーのように見えること
  - 同じ論点の繰り返しでテンポが落ちること
  - 不自然な切り詰めで話者の熱量を損なうこと
  - BGM で感情を過剰演出すること

autonomy:
  mode: full
  may_decide:
    - 使う参加者コメントの選定
    - 発言順の再構成によるストーリー設計
    - 間や言い淀みの整理
    - 尺を60秒前後に寄せるためのトリム調整
    - 要点テロップの短文化
  must_ask:
    - AX-1の訴求メッセージを testimonial 以外へ変更すること
    - 明示的なCTAコピーを新規に追加すること
    - 事実確認が必要な内容を補って表現すること

resolved_assumptions:
  - 主素材は talking-head interview で、発言の強さが最重要である
  - 仕上がりは 16:9 の説明会LP / YouTube 埋め込みを主用途とする
  - 熱量は必要だが、煽りではなく本人の実感から立ち上げる
  - BGM は使わず、話し声と間でテンポを作る
  - テロップは視聴維持のための要点補助として入れる

hypotheses:
  - 経営者は第三者の成功談よりも、参加者本人の納得感ある言葉に強く反応する
  - 最初の 5 秒で「これは自分向けかもしれない」と感じさせれば説明会導線に効く
  - 一人の長尺独白より複数の声を束ねた方が信頼性と熱量の両立がしやすい

forbidden_interpretations:
  - AX-1 を魔法のように即効性がある場として見せること
  - 参加者の発言を誇張して過度な成功保証に見せること

content_hint: AX-1という経営者向けAI研修の参加者インタビュー映像。参加者が学び、気づき、変化、参加価値を日本語で語り、インタビュアーが質問する。今後開催の説明会集客向けに、信頼感と熱量が伝わる testimonial を編集したい。

editorial:
  distribution_channel: web_lp
  aspect_ratio: "16:9"
  embed_context: lp_embed
  hook_priority: credibility_first
  credibility_bias: high
  profile_hint: testimonial_highlight
  policy_hint: no_bgm_with_captions
  allow_inference: true
