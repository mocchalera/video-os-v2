project:
  title: Speech-Led Highlight
  strategy: message-first

message:
  primary: Confirm the central source-grounded message before candidate selection
  secondary:
    - preserve the speaker's meaning
    - make the story easy to review
    - return an editable rough cut

audience:
  primary: intended audience to confirm in Brief

emotion_curve:
  - hook
  - context
  - insight
  - close

# Optional creator-short arc selector: personal_challenge | day_log.
# Leave unset for the legacy path and for credibility-first interview/testimonial work.
# narrative_mode: personal_challenge

must_have:
  - one source-grounded hook
  - one evidence-backed insight
  - one clear close

must_avoid:
  - invented claims
  - unattributed generated footage
  - music-led structure overriding speech

autonomy:
  may_decide:
    - b-roll substitution within the same meaning
    - exact cut position within a beat
  must_ask:
    - central message change
    - required speaker or statement removal
    - message inversion

resolved_assumptions:
  - first-run profile is a Japanese interview, seminar, or event highlight

editorial:
  distribution_channel: unknown
  aspect_ratio: unknown
  embed_context: unknown
  hook_priority: balanced
  credibility_bias: high
  profile_hint: interview-highlight
  policy_hint: interview
  allow_inference: false
