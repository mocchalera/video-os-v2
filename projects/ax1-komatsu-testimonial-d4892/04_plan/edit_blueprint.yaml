version: "1"
project_id: ax1-komatsu-testimonial-d4892
created_at: "2026-07-11T14:14:39Z"

sequence_goals:
  - 小松社長の率直な違和感から始め、AX-1がツールの羅列ではないことを最初の30秒で伝える。
  - 使う側のあり方とAIの落とし穴まで扱うことを、AX-1の信頼根拠として残す。
  - 壁にぶつかる経営者へ、社員を送るだけでなくトップ自身が体験する価値を本人の言葉で閉じる。

beats:
  - id: komatsu_hook
    label: ツールの羅列ではない
    target_duration_frames: 833
    required_roles: [hero]
    purpose: 一般的なAIツール講習との違いを、小松社長の率直な評価で即座に示す。
    story_role: hook
    candidate_plan:
      primary_candidate_ref: CAND_KOMATSU_DIFFERENCE
      fallback_candidate_refs: []
    candidate_constraints:
      allow_interviewer_support: false
      force_unique_utterances: true
    craft:
      in_point: clean_in_clean_out
      out_point: clean_in_clean_out
      transition_in: hard_cut
      transition_out: hard_cut
      rhythm: steady
      beat_sync: false

  - id: komatsu_closing
    label: まずトップが体験する
    target_duration_frames: 1063
    required_roles: [dialogue]
    purpose: AX-1への先入観の変化から、壁にぶつかる経営者への推奨へつなげる。
    story_role: closing
    candidate_plan:
      primary_candidate_ref: CAND_KOMATSU_RECOMMENDATION
      fallback_candidate_refs:
        - CAND_KOMATSU_REFRAME
    candidate_constraints:
      allow_interviewer_support: false
      force_unique_utterances: true
    craft:
      in_point: clean_in_clean_out
      out_point: post_action_hold
      transition_in: hard_cut
      transition_out: hard_cut
      rhythm: breath
      beat_sync: false

pacing:
  opening_cadence: 小松社長の「そこが良かった」からすぐに本題へ入り、質問音声を置かない。
  middle_cadence: 長い一文を意味単位の字幕で支え、発話の呼吸は不自然に詰めない。
  ending_cadence: 「まずトップが感じることが大事」を言い切った後、短い表情の余韻を残す。
  max_shot_length_frames: 1063
  default_duration_target_sec: 79
  confirmed_preferences:
    mode: collaborative
    source: human_confirmed
    duration_target_sec: 79
    confirmed_at: "2026-07-11T14:13:18Z"
    structure_choice: 差別化から経営者への推奨へ進む2ビート構成
    pacing_notes: 30〜90秒の範囲で内容を優先し、16:9・60pxフル字幕・原音のみで初回ラフを作る。

music_policy:
  start_sparse: true
  allow_release_late: false
  entry_beat: komatsu_hook
  avoid_anthemic_lift: true
  permitted_energy_curve: no BGM in the first rough; natural source sound only

caption_policy:
  language: ja
  delivery_mode: both
  source: transcript
  styling_class: clean-lower-third

dialogue_policy:
  preserve_natural_breath: true
  avoid_wall_to_wall_voiceover: false
  prioritize_lines:
    - AIのやり方やツールの羅列だけなら半日ももたなかった
    - 使う側と、100%頼ってはいけない落とし穴まで理解する
    - 壁にぶつかっている経営者にはトライしてほしい
    - 社員を送るだけでなく、まずトップが感じることが大事

transition_policy:
  prefer_match_texture_over_flashy_fx: true
  allow_hard_cuts: true
  allow_crossfade_for_time_passage: false
  avoid_speed_ramps: true
  keep_milestone_cuts_clean: true

ending_policy:
  should_feel: 本人の実感から生まれた、静かで強い推奨
  final_line_strategy: 「まずトップが感じることが大事」で閉じ、CTAコピーを足さない。
  avoid_cta: true
  final_hold_min_frames: 12
  final_visual_strategy: 小松社長の話し終わりの表情を短く保持する。
  final_audio_strategy: 原音の語尾と部屋鳴りを自然に残す。

rejection_rules:
  - S1、S2、S3の音声を主発言として使用しない。
  - 発言の意味を変える文中カットを行わない。
  - 「AIセミナーだと思ったが全然違った」という転換の前半だけを落とさない。
  - Groq誤認識を未校正のまま公開字幕として確定しない。
  - BGM、CTA、氏名、会社名、肩書を初回ラフへ追加しない。

story_arc:
  summary: ツール講習への懐疑から、AX-1の本質理解と経営トップへの推奨へ進む。
  strategy: testimonial_highlight
  chronology_bias: source chronology preserved across two selected answers
  allow_time_reorder: false
  causal_links:
    - AX-1の違いを理解したからこそ、経営者自身に受講を勧められる。

resolved_profile:
  id: interview-highlight
  source: explicit_hint
  rationale: 一人の経営者の発言を根拠にしたspeech-led testimonialであるため。

resolved_policy:
  id: speech-led-testimonial
  source: explicit_hint
  rationale: 原音とフル字幕を中心にし、質問・BGM・過剰演出を除外するため。

active_editing_skills:
  - clean_in_clean_out
  - silence_beat

dedupe_rules:
  utterance_consumption: unique
  semantic_similarity_threshold: 0.9
  allow_intentional_repetition: false

trim_policy:
  mode: adaptive
  default_preferred_duration_frames: 948
  default_min_duration_frames: 720
  default_max_duration_frames: 1080
  action_cut_guard: true

duration_policy:
  mode: guide
  source: explicit_brief
  target_source: explicit_brief
  target_duration_sec: 79
  min_duration_sec: 60
  max_duration_sec: 90
  hard_gate: false
  protect_vlm_peaks: false

timeline_order: chronological
track_layout: single

decision_runtime:
  runtime: agent
  role: transcript-grounded-human-confirmed-blueprint
  attempted_runtimes:
    - runtime: agent
      status: success
      message: Human-confirmed speaker identity, format, and collaborative review gate applied.
