message:
  primary: AX-1はツールの羅列ではなく、経営者自身の経験とAIを結び直し、使う側のあり方まで考える実践的な講座である。
  secondary:
    - 一般的なAIセミナーとの違いを小松社長本人の率直な言葉で伝える。
    - 壁にぶつかる経営者には、社員を送る前にトップ自身が体験する価値があると伝える。
audience:
  primary: AX-1への参加を検討している経営者・事業責任者
  secondary:
    - AI活用の必要性は感じているが、ツール講習だけでは経営に結びつかないと考えている人
    - 実際の参加者が何を得たかを本人の言葉で確認したい見込み参加者
emotion_curve:
  - recognition
  - concrete insight
  - credibility
  - forward momentum
order_policy: editorial
caption_policy: auto
audio_policy: original_only
a1_loudnorm: true
must_have:
  - S4の小松社長だけを主話者にした30〜90秒の独立testimonial
  - AX-1がツールの羅列ではなく、使う側と落とし穴まで扱うという発言
  - 壁にぶつかる経営者へ、まずトップが体験する価値を伝える発言
  - 16:9の画角と、1080pで読みやすい60px日本語フル字幕
must_avoid:
  - S1、S2、S3をtestimonialの主発言として採用すること
  - 本人が述べていない成果保証や過度な成功表現を加えること
  - 質問音声や言い淀みを長く残し、主張をぼかすこと
  - 初回ラフにBGM、CTA、氏名・会社名・肩書を加えること
autonomy:
  mode: collaborative
  skip_confirmations: false
  may_decide:
    - 各話者の採用発言、順序、30〜90秒内の尺
    - 意味を変えない範囲での言い淀み、重複、質問音声の整理
    - 自然な呼吸を保ったin/out位置とカットタイミング
    - 原文に忠実なフル字幕の改行と表示タイミング
  must_ask:
    - 発言の意味が変わる可能性がある再構成
    - 対象話者、中心メッセージ、または16:9フル字幕方針の変更
    - 氏名、肩書、会社名、CTAを新規に画面表示すること
    - 公開用レンダーと外部配布
confirmation_provenance:
  confirmed_at: 2026-07-11T14:13:18Z
  source: interactive_prompt
  caption_policy: auto
  audio_policy: original_only
  questions:
    - 対象女性はB、長髪・黒い服のS3であると確認した。
    - 初回ラフは16:9・フル字幕と確認した。
    - 発言選定と編集は任せ、ラフ2本の後に最終承認する協働モードと確認した。
resolved_assumptions:
  - 入力はD4892.MP4 1本、約12分48秒のAX-1受講後インタビューである。
  - Groq Whisperの日本語文字起こし143発話と、ローカルpyannoteの4話者・183ターンの話者分離を編集根拠にする。
  - 初回ラフは自然な収録音のみを使い、BGMは人間レビュー後まで追加しない。
  - 対象話者は小松社長のみで、別話者の音声を混ぜない。
  - 目標尺は79秒、許容範囲は30〜90秒とする。
hypotheses:
  - 『ツールの羅列ではない』という差別化から『まずトップが受ける』という推奨へつなぐ約79秒が、AX-1の信頼形成に最も効く。
forbidden_interpretations:
  - AX-1を受講すれば事業成果が保証されると見せない。
  - AX-1を単なるAIツール操作講座として見せない。
  - 夫婦関係をtestimonialの信頼根拠として利用しない。
  - 内部ラフの承認を公開許諾として扱わない。
content_hint: AX-1受講後の小松社長（S4、黒いフーディーの男性）のインタビュー。AIツールの羅列ではなく、使う側のあり方、落とし穴、経営経験とAIの結び直し、まず経営トップが受講する価値を語る。
