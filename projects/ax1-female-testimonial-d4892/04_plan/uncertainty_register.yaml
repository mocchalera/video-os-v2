project_id: ax1-female-testimonial-d4892
created_at: "2026-07-11T14:14:39Z"

uncertainties:
  - id: FEMALE-U1-caption-corrections
    type: technical
    question: 演習名、固有名詞、役割語のGroq誤認識を原音確認し、公開可能な日本語字幕へ校正できるか。
    status: monitoring
    evidence:
      - 124秒付近の演習名は「シラスゆでゲーム」と認識されているが確度が低い。
      - 660秒付近の「トップからまたまで」は文脈上「トップから現場まで」等の可能性がある。
    alternatives:
      - label: audio_verified_caption
        description: 原音を聞き、確実な語句だけを字幕へ採用する。
        impact: 信頼性が上がる。初回ラフで実施する。
      - label: omit_uncertain_phrase
        description: 不確実な演習名や個人名を含む発話単位を省く。
        impact: 尺は短くなるが誤字幕を避けられる。
    escalation_required: false

  - id: FEMALE-U2-time-jump
    type: continuity
    question: 144秒付近から620秒付近へのhard cutが、同一人物のjump cutとして不自然に見えないか。
    status: monitoring
    evidence:
      - 2つの採用回答は同じ人物・同じ収録環境だが、約476秒離れている。
      - 初回ラフはB-rollを加えず、発言の具体性を優先する。
    alternatives:
      - label: clean_hard_cut
        description: 文意が「個人の驚き」から「組織の価値」へ変わる地点でhard cutする。
        impact: 構造が明確で、最小加工になる。
      - label: breadth_only
        description: 620秒以降の約52秒回答だけを使う。
        impact: jump cutは消えるが、講座内での驚きと実践感が弱くなる。
    escalation_required: false

  - id: FEMALE-U3-public-rights
    type: legal
    question: 女性経営者の顔、氏名、字幕、発言内容を外部公開してよいか。
    status: open
    evidence:
      - 今回の承認はローカルのラフ制作と最終レビューまでである。
      - 夫婦関係を訴求に使わないことをcreative briefで固定している。
    alternatives:
      - label: internal_only
        description: ローカル内部レビューに限定する。
        impact: 現在の作業を継続できる。
      - label: obtain_release
        description: 公開前に本人・関係者の使用許諾と表記を確認する。
        impact: 別途承認後に外部配布できる。
    escalation_required: true
