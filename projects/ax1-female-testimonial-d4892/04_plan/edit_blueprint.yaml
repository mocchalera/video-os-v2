version: "1"
project_id: ax1-female-testimonial-d4892
created_at: "2026-07-11T14:14:39Z"

sequence_goals:
  - 「こんなことまでできる」という実践中の驚きから始め、受講体験を具体化する。
  - 知識で終わらせず活用したいという意志を保ち、単なる満足コメントにしない。
  - 実作業者、指示者、経営層まで価値が広がることを本人の具体例で示す。

beats:
  - id: female_hook
    label: 実践での驚き
    target_duration_frames: 500
    required_roles: [hero]
    purpose: 講座内で実際に手を動かし、できることの広さに気づいた瞬間をhookにする。
    story_role: hook
    candidate_plan:
      primary_candidate_ref: CAND_FEMALE_DISCOVERY
      fallback_candidate_refs: []
    candidate_constraints:
      allow_interviewer_support: false
      force_unique_utterances: true
    craft:
      in_point: clean_in_clean_out
      out_point: clean_in_clean_out
      transition_in: hard_cut
      transition_out: hard_cut
      rhythm: steady
      beat_sync: false

  - id: female_payoff
    label: 現場から経営層まで
    target_duration_frames: 1255
    required_roles: [dialogue]
    purpose: フォルダ整理の具体例から、組織全体でAIを使う価値へ広げる。
    story_role: closing
    candidate_plan:
      primary_candidate_ref: CAND_FEMALE_BREADTH
      fallback_candidate_refs: []
    candidate_constraints:
      allow_interviewer_support: false
      force_unique_utterances: true
    craft:
      in_point: clean_in_clean_out
      out_point: post_action_hold
      transition_in: hard_cut
      transition_out: hard_cut
      rhythm: breath
      beat_sync: false

pacing:
  opening_cadence: 実践内容へすぐ入り、「ありがとうございました」などの儀礼的な前置きを置かない。
  middle_cadence: 具体例から役割別の価値へ段階的に広げ、字幕で論理を追えるようにする。
  ending_cadence: 「幅広く、いろんな使い方で使っていけたら」で自然に閉じる。
  max_shot_length_frames: 1255
  default_duration_target_sec: 73
  confirmed_preferences:
    mode: collaborative
    source: human_confirmed
    duration_target_sec: 73
    confirmed_at: "2026-07-11T14:13:18Z"
    structure_choice: 実践での驚きから組織全体の価値へ進む2ビート構成
    pacing_notes: 30〜90秒の範囲で内容を優先し、16:9・60pxフル字幕・原音のみで初回ラフを作る。

music_policy:
  start_sparse: true
  allow_release_late: false
  entry_beat: female_hook
  avoid_anthemic_lift: true
  permitted_energy_curve: no BGM in the first rough; natural source sound only

caption_policy:
  language: ja
  delivery_mode: both
  source: transcript
  styling_class: clean-lower-third

dialogue_policy:
  preserve_natural_breath: true
  avoid_wall_to_wall_voiceover: false
  prioritize_lines:
    - 本当にこんなことまでできるんだとびっくりした
    - 知識だけで終わらせず、ちゃんと活用していく
    - 実作業者も、指示を出す側も知った方がいい
    - 経営層もAIの力を使いながら描ける未来がある

transition_policy:
  prefer_match_texture_over_flashy_fx: true
  allow_hard_cuts: true
  allow_crossfade_for_time_passage: false
  avoid_speed_ramps: true
  keep_milestone_cuts_clean: true

ending_policy:
  should_feel: 具体的な実務感から、組織全体への前向きな広がり
  final_line_strategy: 現場からトップまで幅広く使えるという本人の実感で閉じる。
  avoid_cta: true
  final_hold_min_frames: 12
  final_visual_strategy: 女性経営者の話し終わりの表情を短く保持する。
  final_audio_strategy: 原音の語尾と部屋鳴りを自然に残す。

rejection_rules:
  - S1、S2、S4の音声を主発言として使用しない。
  - 女性経営者を小松社長の妻として紹介・訴求しない。
  - 発言の意味を変える文中カットを行わない。
  - Groq誤認識の演習名、固有名詞、役割語を未校正のまま公開字幕として確定しない。
  - BGM、CTA、氏名、会社名、肩書を初回ラフへ追加しない。

story_arc:
  summary: 実践での驚きから、知識を活用へ移す意志と組織全体の価値へ進む。
  strategy: testimonial_highlight
  chronology_bias: source chronology preserved across two selected answers
  allow_time_reorder: false
  causal_links:
    - 自分で実践して可能性を感じたからこそ、現場から経営層までの活用を具体的に想像できる。

resolved_profile:
  id: interview-highlight
  source: explicit_hint
  rationale: 一人の女性経営者の発言を根拠にしたspeech-led testimonialであるため。

resolved_policy:
  id: speech-led-testimonial
  source: explicit_hint
  rationale: 原音とフル字幕を中心にし、質問・BGM・過剰演出を除外するため。

active_editing_skills:
  - clean_in_clean_out
  - silence_beat

dedupe_rules:
  utterance_consumption: unique
  semantic_similarity_threshold: 0.9
  allow_intentional_repetition: false

trim_policy:
  mode: adaptive
  default_preferred_duration_frames: 878
  default_min_duration_frames: 480
  default_max_duration_frames: 1260
  action_cut_guard: true

duration_policy:
  mode: guide
  source: explicit_brief
  target_source: explicit_brief
  target_duration_sec: 73
  min_duration_sec: 50
  max_duration_sec: 90
  hard_gate: false
  protect_vlm_peaks: false

timeline_order: chronological
track_layout: single

decision_runtime:
  runtime: agent
  role: transcript-grounded-human-confirmed-blueprint
  attempted_runtimes:
    - runtime: agent
      status: success
      message: Human-confirmed speaker identity, format, and collaborative review gate applied.
