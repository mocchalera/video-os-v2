version: "1"
project_id: rokutaro-namae-no-nai-saka-20260425
created_at: "2026-04-25T00:00:00+09:00"

project:
  id: rokutaro-namae-no-nai-saka-20260425
  title: "麓太朗 成長記録「名前のない坂」"
  strategy: "坂本 麓太朗（2019年7月7日生まれ）の成長を、時系列の流れとBGM「名前のない坂」の盛り上がりに合わせて見せる家族向け記念映像"
  client: "Family keepsake"
  format: "keepsake-growth-film"
  runtime_target_sec: 256.32
  duration_mode: guide

message:
  primary: "麓太朗が生まれてから、歩き、走り、ストライダーや自転車を通じて大きくなっていく時間の積み重ね"
  secondary:
    - "幼い頃から最近までの変化を、時系列で自然に感じられる"
    - "自転車やアクティビティの動きがかっこよく見える"
    - "本人が将来見返しても嬉しい、家族の声と空気が残る"

audience:
  primary: "家族と、将来この映像を見る本人"
  secondary:
    - "親族"
    - "親しい友人"
  excluded:
    - "SNS向けの短尺縦動画だけを期待する視聴者"

emotion_curve:
  - "静かな始まり"
  - "幼い動きの愛おしさ"
  - "走る・乗る動きへのテンポアップ"
  - "自転車とアクティビティの高まり"
  - "最近の姿で成長を感じる余韻"

must_have:
  - "2019年7月7日生まれの麓太朗の成長を時系列中心で見せる"
  - "歩く、走る、ストライダー、自転車、アクティビティの動きがかっこいいシーンを優先する"
  - "BGM「名前のない坂 (Remastered).mp3」の盛り上がりやリズムにカットを合わせる"
  - "動画内音声で良いセリフや家族の声があれば、BGMを邪魔しない範囲で使う"
  - "日付や年齢のシンプルなテロップを入れる"
  - "曲尺約256.32秒に自然に収める"

must_avoid:
  - "過剰なエフェクトや安っぽい演出"
  - "説明的すぎるテロップ"
  - "転倒や失敗を強調して危険そうに見せること"
  - "曲尺を無視した短縮"
  - "時系列を大きく崩して成長の流れが分からなくなること"

autonomy:
  mode: full
  may_decide:
    - "クリップの選定と並び順"
    - "カットのタイミング"
    - "BGMとの同期ポイント"
    - "使うセリフの選定"
    - "日付・年齢テロップの文言と表示位置"
    - "カラーと音量の自然な調整"
    - "完成MP4が難しい場合のPremiere XML代替出力"
  must_ask: []

resolved_assumptions:
  - "素材フォルダ内に使用NG素材はない"
  - "BGM「名前のない坂」は使用許諾済みとして扱う"
  - "完成動画は横長16:9で作る"
  - "視聴者は家族と将来本人"
  - "編集判断、セリフ選定、テロップ文言、カット順は原則こちらで決める"
  - "素材は2019年7月から2026年2月までの麓太朗の成長記録として扱う"

hypotheses:
  - "2019年から2026年までの撮影日順を基本にすると、成長の流れが最も伝わる"
  - "BGMのサビや盛り上がりには、自転車やアクティビティの最も動きが強いシーンが合う"
  - "家族の声は全編ではなく、印象的な一言を短く残す方がBGMとのバランスが良い"

forbidden_interpretations:
  - "競技スポーツのハイライト動画"
  - "子どもの失敗や転倒を見世物にする映像"
  - "SNS向けに過度に派手な短尺広告"

content_hint: "日本人の男の子・坂本 麓太朗（さかもと ろくたろう、2019年7月7日生まれ）の成長記録。0歳から6歳頃まで、歩く、走る、ストライダー、自転車、屋外アクティビティを家族が撮影したホームビデオ。動きのかっこいい場面、家族の良い声、時系列の変化、日付や年齢が重要。"

editorial:
  distribution_channel: event_recap
  aspect_ratio: "16:9"
  embed_context: standalone
  hook_priority: balanced
  credibility_bias: high
  profile_hint: keepsake
  policy_hint: "chronological full-song growth film with simple date captions, natural sound highlights, and beat-synced action cuts"
  allow_inference: true
