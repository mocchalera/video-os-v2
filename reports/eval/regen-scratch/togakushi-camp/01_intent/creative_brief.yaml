version: "1"
project_id: togakushi-camp
created_at: "2026-06-15T22:00:00Z"

project:
  id: togakushi-camp
  title: "戸隠ファミリーキャンプ — 自然と子供たちの成長"
  strategy: emotion-first
  format: client-pv
  runtime_target_sec: 120
  duration_mode: guide

message:
  primary: "戸隠の環境の素晴らしさと子供たちの成長"
  secondary:
    - 大自然の中での家族の時間
    - 子供たちが自然と触れ合い成長する姿
    - キャンプの非日常がもたらす家族の絆

audience:
  primary: "長野市観光協会（クライアント）"
  secondary:
    - "戸隠高原キャンプ場の潜在利用者"
    - "ファミリーキャンプに興味のある家族層"

emotion_curve:
  - wonder
  - excitement
  - warmth
  - serenity
  - joy
  - nostalgia

must_have:
  - 焚き火のシーン
  - 星空
  - 子供の表情（楽しさ・発見）
  - 到着〜設営の導入
  - BBQ・食事の家族時間
  - 朝の静かな空気感
  - BGM「Only This Matters」(Adobe Stock)全編使用

must_avoid:
  - 過度な演出やエフェクト
  - カットが急ぎすぎる構成
  - 暗すぎる映像の長時間使用
  - 音声の不自然な切れ方

autonomy:
  mode: full
  may_decide:
    - 各クリップの使用範囲（イン・アウト点）
    - リタイミング（スローモーション）の適用
    - ディゾルブの長さ
    - カラーグレーディング
  must_ask:
    - BGM以外の楽曲追加
    - クリップの完全除外

resolved_assumptions:
  - BGMの尺（約4分）に動画全体を合わせる
  - 2日間の時系列を基本とする（1日目→2日目）
  - オープニングは戸隠を象徴する景色カット（T015/T012/T016）
  - 後半は時系列順で構成
  - 前半のオープニングカットを後半で再使用（対比・ブックエンド構造）
  - リタイミングで印象的なカットをスローに（9箇所）
  - フェードアウトで終わる

content_hint: "戸隠高原の家族キャンプ。2日間の撮影。4K ProRes 24p。NINJAV(Atomos収録)の本編カット+DJIドローン空撮+D810/D850タイムラプス。日本語の会話あり。クライアント案件PV。"

editorial:
  distribution_channel: web_lp
  aspect_ratio: "16:9"
  embed_context: standalone
  hook_priority: balanced
  credibility_bias: low
