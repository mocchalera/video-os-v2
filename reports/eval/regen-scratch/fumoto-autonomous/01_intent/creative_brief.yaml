version: "1"
project_id: fumoto-growth
created_at: "2026-03-23T12:00:00Z"

project:
  id: fumoto-growth
  title: "麓太朗 成長記録 — はじめの一歩から自転車まで"
  strategy: emotion-first
  format: family-documentary
  runtime_target_sec: 256
  duration_mode: guide

message:
  primary: "一歩ずつ、確実に。小さな足が刻んだ6年間の物語"
  secondary:
    - 歩けるようになった喜び
    - 走れるようになった自信
    - ストライダーでバランスを覚えた日々
    - 自転車に乗れた瞬間の達成感
    - 親子の温かい時間

audience:
  primary: "家族・親族"
  secondary:
    - "将来の本人"

emotion_curve:
  - tenderness
  - wonder
  - joy
  - pride
  - warmth
  - nostalgia

must_have:
  - 時系列順の成長過程
  - 歩行の初めての瞬間
  - 走る楽しさ
  - ストライダーに乗る姿
  - 自転車に乗れた達成シーン
  - 撮影日テロップ（YYYY.MM形式）
  - 心温まるコメントテロップ（控えめに）
  - BGM「名前のない坂 (Remastered)」全編使用
  - 動画の声・環境音のミックス
  - フェードアウトで終わる

must_avoid:
  - 過度な演出やエフェクト
  - テロップの出し過ぎ
  - 急ぎすぎるカット
  - 音声の不自然な切れ方
  - 暗すぎる映像の長時間使用

autonomy:
  mode: full
  may_decide:
    - 各クリップの使用範囲（イン・アウト点）
    - ディゾルブの長さ
    - 環境音のミックスバランス微調整
    - テロップの文言
  must_ask:
    - BGM以外の楽曲追加
    - 映像の大幅な色補正
    - クリップの完全除外

resolved_assumptions:
  - BGMの尺（約4分16秒）に動画全体を合わせる
  - テロップは撮影日と短いコメントのみ
  - 時系列順を基本とする
  - フェードアウトは黒へ3秒かけて行う
  - 動画の声はBGMの合間に聴こえる程度にミックス

content_hint: "子供の成長記録。生まれてから歩行→走行→ストライダー→自転車まで。家族のホームビデオ。日本語の声が含まれる。"

editorial:
  distribution_channel: unknown
  aspect_ratio: "16:9"
  embed_context: standalone
  hook_priority: balanced
  credibility_bias: low
